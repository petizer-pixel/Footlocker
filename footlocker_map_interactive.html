body { font-family:'Heebo',sans-serif; background:#0a0a0a; color:#f0ebe0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.subtitle { font-size:10px; color:#555; letter-spacing:1px; }
.stats { display:flex; gap:20px; }
.stat-num { font-size:24px; font-weight:900; color:#e31837; line-height:1; }
.stat-lbl { font-size:9px; color:#555; letter-spacing:1.5px; text-transform:uppercase; }

.main { display:flex; flex:1; overflow:hidden; }

/* SIDEBAR */
.sidebar { width:280px; background:#111; border-left:1px solid #222; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
.sidebar-top { padding:12px 14px; background:#161616; border-bottom:1px solid #222; }
input.search { width:100%; background:#0a0a0a; border:1px solid #2a2a2a; color:#f0ebe0; padding:8px 10px; font-family:'Heebo',sans-serif; font-size:13px; direction:rtl; outline:none; margin-bottom:8px; }
input.search:focus { border-color:#e31837; }
input.search::placeholder { color:#444; }
.filters { display:flex; flex-wrap:wrap; gap:5px; }
.btn { padding:3px 9px; font-size:10px; font-family:'Heebo',sans-serif; cursor:pointer; border:1px solid #2a2a2a; background:transparent; color:#666; letter-spacing:.5px; transition:all .15s; }
.btn:hover, .btn.on { background:#e31837; color:#fff; border-color:#e31837; }
.count { font-size:10px; color:#444; margin-top:6px; }

.list { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#e31837 #0a0a0a; }
.item { padding:10px 14px; border-bottom:1px solid #1a1a1a; cursor:pointer; transition:background .12s; direction:rtl; }
.item:hover { background:#1a1a1a; }
.item.active { background:#1a0507; border-right:3px solid #e31837; }
.item-city { font-size:12px; font-weight:700; }
.item-name { font-size:11px; color:#666; margin-top:1px; }
.item-hrs { font-size:10px; color:#3a3a3a; margin-top:2px; }

/* MAP */
#map { flex:1; }

/* Leaflet popup override */
.leaflet-popup-content-wrapper {
  background:#0d0d0d !important;
  border:1px solid #e31837 !important;
  border-radius:0 !important;
  box-shadow:0 4px 20px rgba(227,24,55,.3) !important;
  color:#f0ebe0 !important;
  font-family:'Heebo',sans-serif !important;
  direction:rtl;
}
.leaflet-popup-tip { background:#e31837 !important; }
.leaflet-popup-close-button { color:#e31837 !important; }
.popup-city { font-size:14px; font-weight:900; color:#e31837; }
.popup-name { font-size:12px; color:#bbb; margin-top:3px; }
.popup-hrs { font-size:11px; color:#555; margin-top:5px; line-height:1.7; }
.popup-phone { font-size:11px; color:#e31837; margin-top:5px; }

/* Custom marker */
.fl-marker {
  width:12px; height:12px; background:#e31837;
  border-radius:50%; border:2px solid rgba(227,24,55,.4);

.fl-marker:hover { transform:scale(1.6); background:#c9a84c; }

];

// Region colors
const COLORS = {
  north:'#3b82f6', center:'#e31837', south:'#f59e0b', jerusalem:'#8b5cf6', eilat:'#10b981'
};

let map, markers = [], activeRegion = 'all', activeMarker = null;

function makeIcon(region, big=false) {
  const c = COLORS[region] || '#e31837';
  const s = big ? 16 : 10;
  return L.divIcon({
    className:'',
    html:`<div style="width:${s}px;height:${s}px;background:${c};border-radius:50%;border:2px solid ${c}44;box-shadow:0 0 6px ${c}88;transition:all .2s"></div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2]
  });
}

function initMap() {
  map = L.map('map', { center:[31.5, 34.85], zoom:7, zoomControl:true });

  // Dark tile layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);

  // Add zoom control to bottom-left
  map.zoomControl.setPosition('bottomleft');

  buildMarkers();
  buildList();
}

function buildMarkers() {
  markers.forEach(m => map.removeLayer(m.layer));
  markers = [];

  const filtered = getFiltered();
  filtered.forEach(s => {
    const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.region) })
      .addTo(map)
      .bindPopup(`
        <div class="popup-city">${s.city}</div>
        <div class="popup-name">${s.name}</div>
        <div class="popup-hrs">${s.hours.replace(/\|/g,'\n')}</div>
        ${s.phone ? `<div class="popup-phone">📞 ${s.phone}</div>` : ''}
      `, { direction:'rtl', maxWidth:220 });

    m.on('click', () => highlightItem(s));
    markers.push({ store: s, layer: m });
  });

  document.getElementById('countLbl').textContent = `מציג ${filtered.length} סניפים`;
  document.getElementById('countNum').textContent = filtered.length;
}

function buildList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = getFiltered();
  filtered.forEach(s => {
    const d = document.createElement('div');
    d.className = 'item';
    d.dataset.lat = s.lat; d.dataset.lng = s.lng;
    const dot = `<span style="display:inline-block;width:8px;height:8px;background:${COLORS[s.region]};border-radius:50%;margin-left:6px;vertical-align:middle"></span>`;
    d.innerHTML = `<div class="item-city">${dot}${s.city}</div><div class="item-name">${s.name}</div><div class="item-hrs">${s.hours.split('|')[0]}</div>`;
    d.onclick = () => {
      map.setView([s.lat, s.lng], 14);
      const mk = markers.find(m => m.store === s);
      if (mk) { mk.layer.openPopup(); mk.layer.setIcon(makeIcon(s.region, true)); }
      document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      d.classList.add('active');
      d.scrollIntoView({ behavior:'smooth', block:'nearest' });
    };
    list.appendChild(d);
  });
}

function highlightItem(s) {
  const items = document.querySelectorAll('.item');
  const filtered = getFiltered();
  const idx = filtered.indexOf(s);
  items.forEach(i => i.classList.remove('active'));
  if (idx >= 0 && items[idx]) { items[idx].classList.add('active'); items[idx].scrollIntoView({behavior:'smooth', block:'nearest'}); }
}

function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return ALL.filter(s => {
    const rOk = activeRegion === 'all' || s.region === activeRegion;
    const qOk = !q || s.city.includes(q) || s.name.toLowerCase().includes(q);
    return rOk && qOk;
  });
}

function doFilter() { buildMarkers(); buildList(); }

function setRegion(r, btn) {
  activeRegion = r;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  buildMarkers(); buildList();

  // Fly to region
  const bounds = { north:[33.0,32.4,35.0,33.5], center:[31.8,32.2,34.5,35.2], south:[30.8,31.8,34.3,35.5], jerusalem:[31.6,31.9,34.9,35.5], eilat:[29.4,29.7,34.8,35.1] };
  if (r !== 'all' && bounds[r]) {
    const [s,n,w,e] = bounds[r];
    map.fitBounds([[s,w],[n,e]], {padding:[30,30]});
  } else {
    map.setView([31.5, 34.85], 7);
  }
}

window.onload = initMap;
